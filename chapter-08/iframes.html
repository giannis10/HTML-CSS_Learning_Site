<!DOCTYPE html>
<html lang="el">
	<head>
		<link rel="stylesheet" href="../code-helper.css">
		<meta charset="utf-8">
		<title>Πλαίσια iFrame</title>
	</head>
	<body>
		<iframe width="450" height="350" src="https://maps.google.com/maps?q=acropolis+museum+athens&amp;output=embed">
		</iframe>
	
		<div class="code-explainer-card">
			<div class="code-explainer-header">
				<span class="code-explainer-badge">Οδηγός &amp; Επεξήγηση</span>
				<h3 class="code-explainer-title">💡 Ενσωματωμένα Πλαίσια (<iframe>)</h3>
				<p class="code-explainer-desc">Η ετικέτα <code>&lt;iframe src="url" width="..." height="..."&gt;</code> επιτρέπει την ενσωμάτωση ενός άλλου εγγράφου ή εξωτερικού περιεχομένου (π.χ. Google Maps) μέσα στη σελίδα.</p>
			</div>
			<div class="code-box-wrapper">
				<div class="code-box-topbar">
					<span class="code-box-label">💻 Πηγαίος Κώδικας Παραδείγματος</span>
					<button class="code-copy-btn" onclick="copyCodeSnippet(this)">📋 Αντιγραφή Κώδικα</button>
				</div>
				<pre class="code-pre-block"><code>&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;el&quot;&gt;
	&lt;head&gt;
		&lt;meta charset=&quot;utf-8&quot;&gt;
		&lt;title&gt;Πλαίσια iFrame&lt;/title&gt;
	&lt;/head&gt;
	&lt;body&gt;
		&lt;iframe width=&quot;450&quot; height=&quot;350&quot; src=&quot;https://maps.google.com/maps?q=acropolis+museum+athens&amp;amp;output=embed&quot;&gt;
		&lt;/iframe&gt;
	&lt;/body&gt;
&lt;/html&gt;</code></pre>
			</div>
			<div class="code-explainer-footer">

		</div>
		<script src="../code-helper.js"></script>

	</body>
</html>
