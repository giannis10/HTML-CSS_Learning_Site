<!DOCTYPE html>
<html lang="el">
	<head>
		<link rel="stylesheet" href="../code-helper.css">
		<meta charset="utf-8">
		<title>Πλαίσιο Πολλαπλής Επιλογής (Multiple Select)</title>
	</head>
	<body>
		<form action="http://www.example.com/profile.php">
			<p>Παίζετε κάποιο από τα παρακάτω μουσικά όργανα; (Μπορείτε να επιλέξετε περισσότερες από μία επιλογές κρατώντας πατημένο το πλήκτρο Ctrl σε PC ή Command σε Mac καθώς επιλέγετε.)</p>
			<select name="instruments" size="3" multiple="multiple">
				<option value="guitar" selected="selected">Κιθάρα</option>
				<option value="drums">Ντραμς</option>
				<option value="keyboard" selected="selected">Πλήκτρα</option>
				<option value="bass">Μπάσο</option>
			</select>
		</form>
	
		<div class="code-explainer-card">

				<span class="code-explainer-badge">Οδηγός &amp; Επεξήγηση</span>
				<h3 class="code-explainer-title">💡 Λίστα Πολλαπλής Επιλογής (<select multiple>)</h3>
				<p class="code-explainer-desc">Προσθέτοντας το γνώρισμα <code>multiple="multiple"</code> και <code>size="3"</code>, ο χρήστης μπορεί να επιλέξει πολλαπλά στοιχεία κρατώντας πατημένο το πλήκτρο Ctrl (ή Command σε Mac).</p>
			</div>

				<div class="code-box-topbar">
					<span class="code-box-label">💻 Πηγαίος Κώδικας Παραδείγματος</span>
					<button class="code-copy-btn" onclick="copyCodeSnippet(this)">📋 Αντιγραφή Κώδικα</button>
				</div>
