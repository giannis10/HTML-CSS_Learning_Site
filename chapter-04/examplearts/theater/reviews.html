<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <title>Σελίδα Προορισμού Συνδέσμου • G.T DEV</title>
    <link rel="stylesheet" href="../../../../code-helper.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #070b14; color: #f8fafc; padding: 40px 20px; text-align: center; }
        .box { max-width: 600px; margin: 40px auto; background: #0f172a; border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #38bdf8; margin-bottom: 12px; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
        a { color: #38bdf8; text-decoration: none; font-weight: 600; display: inline-block; padding: 8px 16px; background: rgba(56, 189, 248, 0.15); border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.3); }
        a:hover { background: #38bdf8; color: #070b14; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔗 Δοκιμαστική Σελίδα Προορισμού (Link Target)</h1>
        <p>Φτάσατε επιτυχώς σε αυτή τη σελίδα μέσω σχετικού συνδέσμου (Relative Link) στο πλαίσιο των εκπαιδευτικών ασκήσεων του Κεφαλαίου 4.</p>
        <p><a href="javascript:history.back()">⬅ Επιστροφή στην Προηγούμενη Σελίδα</a></p>
    </div>
</body>
</html>
